# 可选：覆盖本机 MySQL 密码与 JWT（见 application-local.properties.example，勿提交）
spring.config.import=optional:classpath:application-local.properties

# BridgeAgent 后端配置。工作目录一般是 bridge_agent_demo，图纸会落到 data/files。
spring.application.name=bridge_agent_demo
server.port=8080

# 本机 MySQL，库名 bridge_agent（见 src/main/resources/db/schema.sql）
# 密码只写在本机 application-local.properties，不要提交。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bridge_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 列名 opened_on 自动映射成 Java 的 openedOn
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.type-aliases-package=myz.bridge_agent_demo.entity
# 跨径 JSON ↔ List 的类型处理器所在包
mybatis-plus.type-handlers-package=myz.bridge_agent_demo.config.mybatis

logging.level.myz.bridge_agent_demo.mapper=debug

# 单文件 200MB（汇总图很大）；一次请求可多份，总上限 2GB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=2048MB

# 相对运行目录；已在 .gitignore 里忽略 data/
app.storage-root=data/files
app.knowledge-storage-root=data/knowledge
app.model-storage-root=data/models
app.avatar-storage-root=data/avatars

# Python 是唯一 Agent 大脑。启动：在 python_agent 目录 python app.py（需 .env 里的百炼 Key）
app.python-agent-url=http://127.0.0.1:8001
app.python-agent-read-timeout-seconds=600
# 建模含最多 3 次规范检索（各可再纠正 1 次）+ SAP COM，单独加长
app.python-agent-modeling-timeout-seconds=900
# 知识解析含 Unstructured job + 多张附图千问，单独放宽
app.python-knowledge-parse-timeout-seconds=1800
# 知识合并只读 JSON，短超时即可
app.python-knowledge-merge-timeout-seconds=120
# 知识过长分割：超长块调 embedding，按句分批
app.python-knowledge-split-timeout-seconds=300
# 知识嵌入：整本 dense&sparse 写入 Milvus
app.python-knowledge-embed-timeout-seconds=600
# 知识检索：问句 embedding + 混搜，自我纠正最多再 embed/搜/评一次
app.python-knowledge-search-timeout-seconds=120

# 登录 JWT：密钥只放本机 application-local.properties（至少 32 字），不进前端、不进 Python、不进 Git。
app.jwt.secret=
app.jwt.expire-hours=8

# 问询组包：超过模型输入上限的该比例再摘要；最近 N 轮（一问一答）不进摘要
app.memory.context-budget-ratio=0.7
app.memory.inquiry-window-turns=8

# 建模：本机 SAP2000 22 COM；自动补识图次数与 STM 墓碑上限
app.sap.prog-id=CSI.SAP2000.API.SapObject
app.sap.version=22.0.0
app.modeling.max-auto-supplements=4
app.modeling.stm-tombstone-limit=80

# 资源队列三车道：救急=0；池内每条车道再囤 5 个已派发任务
app.queue.drawing-core=2
app.queue.knowledge-core=2
app.queue.sap-core=1
app.queue.pool-queue-capacity=5
